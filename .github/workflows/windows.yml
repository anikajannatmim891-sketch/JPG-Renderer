name: Windows production installer and acceptance
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer from this commit as a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/vendor/chromium
      UVRS_SOFTWARE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run browser:install
      - run: npm run resources:prepare
      - run: npm test
      - run: npm run build
      - run: npm run test:render
      - run: npm run test:metadata
      - run: npm run test:autopilot
        env:
          UVRS_FULL_BATCH: '1'
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record installer identity
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "release/Universal-Visual-Render-Studio-Setup-$version.exe"
          $digest = Get-FileHash $installer.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force test-output | Out-Null
          @{ sourceRun = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA; sha256 = $digest.Hash; bytes = $installer.Length } | ConvertTo-Json | Set-Content -Encoding utf8 test-output/installer-origin.json
          "$($digest.Hash.ToLower())  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          "UVRS_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Visual-Render-Studio-Setup-${{ env.UVRS_VERSION }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-render-and-metadata-evidence
          path: |
            test-output/**/*.json
            test-output/**/*.jpg
            test-output/**/*.png
            test-output/**/*.webp
            test-output/**/*.svg
            test-output/**/*.eps
          if-no-files-found: warn
      - name: Publish verified Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:UVRS_VERSION"
          $installer = "release/Universal-Visual-Render-Studio-Setup-$env:UVRS_VERSION.exe"
          $notes = "Windows x64 NSIS installer. The build passed the renderer, ExifTool readback, Autopilot and installed-app acceptance checks. CI used software WebGL. Commit: $env:GITHUB_SHA."
          gh release create $tag $installer "$installer.sha256" --target $env:GITHUB_SHA --title "Universal Visual Render Studio $env:UVRS_VERSION" --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
