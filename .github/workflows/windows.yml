name: Windows production installer and acceptance
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer from this commit as a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.identity.outputs.version }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/vendor/chromium
      UVRS_SOFTWARE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run browser:install
      - run: npm run resources:prepare
      - run: npm test
      - run: npm run build
      - run: npm run test:render
      - run: npm run test:metadata
      - run: npm run test:autopilot
      - run: npm run test:graphics
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record installer identity
        id: identity
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "release/Universal-Visual-Render-Studio-Setup-$version.exe"
          $digest = Get-FileHash $installer.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force test-output | Out-Null
          @{ sourceRun = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA; sha256 = $digest.Hash; bytes = $installer.Length } | ConvertTo-Json | Set-Content -Encoding utf8 test-output/installer-origin.json
          "$($digest.Hash.ToLower())  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          "UVRS_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Visual-Render-Studio-Setup-${{ env.UVRS_VERSION }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-render-and-metadata-evidence
          path: |
            test-output/**/*.json
            test-output/**/*.jpg
            test-output/**/*.png
            test-output/**/*.webp
            test-output/**/*.svg
            test-output/**/*.eps
          if-no-files-found: warn
  production-batch:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/vendor/chromium
      UVRS_SOFTWARE_TEST: '1'
      UVRS_FULL_BATCH: '1'
      UVRS_AUTOPILOT_FILTER: '200-entry'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run browser:install
      - run: npm run test:autopilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-200-artwork-batch-evidence
          path: test-output/autopilot/**/acceptance.json
          if-no-files-found: warn
  graphics-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/vendor/chromium
      UVRS_SOFTWARE_TEST: '1'
      UVRS_WEBGPU_TEST: '1'
      UVRS_WEBGPU_CANVAS_TEST: '1'
      UVRS_GRAPHICS_FILTER: 'WebGPU|TSL'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npm run browser:install
      - run: npm run test:graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WebGPU-rendering-evidence
          path: test-output/graphics/**/*
          if-no-files-found: warn
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [windows, production-batch, graphics-webgpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UVRS_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Universal-Visual-Render-Studio-Setup-${{ env.UVRS_VERSION }}
      - name: Publish verified Windows installer
        run: |
          installer="Universal-Visual-Render-Studio-Setup-$UVRS_VERSION.exe"
          sha256sum --check "$installer.sha256"
          gh release create "v$UVRS_VERSION" "$installer" "$installer.sha256" \
            --target "$GITHUB_SHA" --title "Universal Visual Render Studio $UVRS_VERSION" \
            --notes "Windows x64 NSIS installer. Passed installed-app, native rendering, ExifTool readback and 200-entry batch acceptance. CI used software WebGL and WebGPU. Commit $GITHUB_SHA."
