<!doctype html><style>html,body{margin:0;overflow:hidden}canvas{display:block}</style><canvas></canvas><script>const canvas=document.querySelector('canvas');const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});if(!gl)throw new Error('WebGL2 unavailable');const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,'#version 300 es\n in vec2 pos;void main(){gl_Position=vec4(pos,0.,1.);}'));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,'#version 300 es\n precision highp float;uniform vec2 size;out vec4 color;void main(){vec2 uv=gl_FragCoord.xy/size;color=vec4(uv.x,uv.y,.4+.3*sin(uv.x*30.)*cos(uv.y*20.),1.);}'));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(p,'pos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);window.renderStudio={version:1,render({width,height,pixelRatio}){canvas.width=width;canvas.height=height;canvas.style.width=width/pixelRatio+'px';canvas.style.height=height/pixelRatio+'px';gl.viewport(0,0,width,height);gl.uniform2f(gl.getUniformLocation(p,'size'),width,height);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();}};</script>
