<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{width:960px;height:540px;display:block}</style>
<canvas></canvas><script>
const canvas=document.querySelector('canvas');
const worker=new Worker('paint-worker.js');
const surface=canvas.transferControlToOffscreen();
worker.postMessage({surface},[surface]);
window.renderStudio={
  version:2,engine:'OffscreenCanvas worker / Canvas 2D',design:{width:960,height:540},
  render({width,height}){
    return new Promise((resolve,reject)=>{
      worker.onmessage=({data})=>data==='done'?resolve():reject(new Error(data));
      worker.onerror=reject;
      worker.postMessage({width,height});
    });
  },
  dispose:()=>worker.terminate(),
};
</script>
