<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{width:960px;height:540px;display:block}</style>
<canvas></canvas><script>
const canvas=document.querySelector('canvas');
const surface=canvas.getContext('2d');
let device,pipeline,uniforms,group;
window.renderStudio={
  version:2,engine:'WebGPU / WGSL texture readback',design:{width:960,height:540},
  async ready(){
    const adapter=await navigator.gpu?.requestAdapter();
    if(!adapter)throw new Error('No WebGPU adapter');
    device=await adapter.requestDevice({requiredLimits:{maxTextureDimension2D:adapter.limits.maxTextureDimension2D}});
    const module=device.createShaderModule({code:await fetch('procedural.wgsl').then(r=>r.text())});
    pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vertex'},
      fragment:{module,entryPoint:'fragment',targets:[{format:'rgba8unorm'}]}});
    uniforms=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniforms}}]});
  },
  async render({width,height}){
    canvas.width=width;canvas.height=height;
    const bytesPerRow=Math.ceil(width*4/256)*256;
    const texture=device.createTexture({size:[width,height],format:'rgba8unorm',
      usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
    const buffer=device.createBuffer({size:bytesPerRow*height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    try {
      device.queue.writeBuffer(uniforms,0,new Float32Array([width,height,0,0]));
      const encoder=device.createCommandEncoder();
      const pass=encoder.beginRenderPass({colorAttachments:[{view:texture.createView(),
        loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}]});
      pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.draw(3);pass.end();
      encoder.copyTextureToBuffer({texture},{buffer,bytesPerRow},[width,height]);
      device.queue.submit([encoder.finish()]);
      await buffer.mapAsync(GPUMapMode.READ);
      const raw=new Uint8Array(buffer.getMappedRange());
      const image=new ImageData(width,height);
      for(let y=0;y<height;y++) image.data.set(raw.subarray(y*bytesPerRow,y*bytesPerRow+width*4),y*width*4);
      buffer.unmap();
      surface.putImageData(image,0,0);
    } finally {buffer.destroy();texture.destroy();}
  },
  dispose(){device?.destroy();},
};
</script>
