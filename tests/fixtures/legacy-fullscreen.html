<!doctype html><meta charset="utf-8">
<title>Color field</title><meta name="description" content="An asymmetric full-image shader with a petal field.">
<meta name="keywords" content="color,shader,field,2027,007">
<style>html,body{margin:0}canvas{display:block;width:960px;height:540px}</style>
<canvas></canvas>
<script>
const canvas=document.querySelector('canvas');
const CW = 960;
const CH = 540;
// Legacy backing-store sizing caps each edge at 2048, even on a large GPU.
canvas.width=Math.min(2048,Math.round(CW*devicePixelRatio));
canvas.height=Math.min(2048,Math.round(CH*devicePixelRatio));
const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});
function compile(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
  return shader;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,`#version 300 es
void main(){ vec2 p=vec2((gl_VertexID << 1) & 2,gl_VertexID & 2);gl_Position=vec4(p*2.0-1.0,0,1); }`));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;
uniform vec2 resolution;
uniform float optionalTime;
out vec4 color;
void main(){
  vec2 uv=gl_FragCoord.xy/resolution;
  color=vec4(.07+.77*uv.x,.10+.75*uv.y,.4+.27*sin(uv.x*16.)*sin(uv.y*24.),1);
}`));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
gl.viewport(0,0,canvas.width,canvas.height);
gl.uniform2f(gl.getUniformLocation(program,'resolution'),canvas.width,canvas.height);
gl.uniform1f(gl.getUniformLocation(program,'optionalTime'),42);
gl.drawArrays(gl.TRIANGLES,0,3);
</script>
