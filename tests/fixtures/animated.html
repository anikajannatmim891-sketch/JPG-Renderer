<!doctype html><canvas></canvas><script>const c=document.querySelector('canvas');let raf;function live(){raf=requestAnimationFrame(live);}live();window.renderStudio={version:1,render({width,height,pixelRatio,time,seed}){cancelAnimationFrame(raf);c.width=width;c.height=height;c.style.width=width/pixelRatio+'px';c.style.height=height/pixelRatio+'px';document.body.style.margin=0;const x=c.getContext('2d');x.fillStyle='#1d2d53';x.fillRect(0,0,width,height);x.fillStyle='#afef94';x.beginPath();x.arc(width*(.5+.3*Math.sin(time+seed)),height*.5,height*.2,0,7);x.fill();}};</script>
