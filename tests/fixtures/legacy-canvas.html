<!doctype html><meta charset="utf-8">
<title>Open arcs</title><meta name="description" content="Seeded paths and a layered gradient on a panoramic canvas.">
<meta name="keywords" content="arcs,paper,organic,2027,007,landscape">
<style>html,body{margin:0}canvas{display:block;width:2400px;height:1000px}</style>
<canvas></canvas>
<script>
const CW = 2400;
const CH = 1000;
const card = document.querySelector('canvas');
card.width = CW;
card.height = CH;
const g = card.getContext('2d');
const gradient = g.createLinearGradient(0,0,CW,CH);
gradient.addColorStop(0,'#211e3d');
gradient.addColorStop(1,'#c6674e');
g.fillStyle = gradient;
g.fillRect(0,0,CW,CH);
let seed = 76;
for (let i=0;i<40;i++) {
  seed = (Math.imul(1664525,seed) + 1013904223) >>> 0;
  const x = (seed / 2**32) * CW;
  g.strokeStyle = i%2 ? '#f9cf8a' : '#874b68';
  g.lineWidth = 2 + i%13;
  g.beginPath();
  g.ellipse(x,CH * (i%12)/12,65+i*5,38+i*3,i*Math.PI/18,0,Math.PI*2);
  g.stroke();
}
g.font='80px serif';g.fillStyle='#fff0c5';g.fillText('Open arcs', CW*.08, CH*.74);
</script>
